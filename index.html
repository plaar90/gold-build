<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>Scythe Automa Helper</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" referrerpolicy="no-referrer" />
<style>
:root{--bg:#0a0b0d;--panel:#111317;--panel2:#16191e;--ink:#f4f6f8;--muted:#8b929c;--line:#272b32;--soft:#1b1f25;--human:#e58a2a;--automa:#3aa7e8;--accent:#e9edf2;--lake:#132631;--factory:#242129}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,select,input{font:inherit;color:inherit}.app{max-width:1220px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}.brand{font-size:20px;font-weight:760;letter-spacing:-.03em}.sub,.muted{color:var(--muted)}.sub{font-size:12px}.layout{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:14px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;box-shadow:0 12px 34px #0004}.board-wrap{padding:12px;position:relative}.board-head{display:flex;align-items:center;justify-content:space-between;padding:2px 4px 10px}.board-hint{font-size:12px;color:var(--muted)}#board{display:block;width:100%;aspect-ratio:890/848;min-height:600px;border:1px solid var(--line);border-radius:13px;background:#0d0f12}.side{overflow:hidden}.box{padding:14px;border-bottom:1px solid var(--line)}.box:last-child{border-bottom:0}.label{font-size:10px;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);margin-bottom:6px}.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.field select,.field input{width:100%;border:1px solid var(--line);background:var(--panel2);padding:9px;border-radius:9px}.phase-line{display:flex;justify-content:space-between;align-items:center}.phase{font-weight:750}.badge{border:1px solid var(--line);background:var(--panel2);border-radius:999px;padding:4px 8px;font-size:11px}.tracker{display:flex;gap:4px;flex-wrap:wrap;margin-top:10px}.track-cell{width:23px;height:23px;border:1px solid var(--line);border-radius:6px;display:grid;place-items:center;font-size:10px;color:#69717c;background:#0d0f12}.track-cell.done{background:#eef1f4;color:#0b0d10;border-color:#eef1f4}.track-cell.current{outline:2px solid #7b8490;outline-offset:1px}.track-cell.phase2{font-weight:800}.stars{font-size:34px;line-height:1;letter-spacing:7px;margin-top:14px;text-align:center;width:100%}.draw{width:100%;border:0;background:#f3f5f7;color:#0a0b0d;border-radius:10px;padding:13px;font-weight:800;cursor:pointer}.draw:disabled{opacity:.4;cursor:default}.secondary{width:100%;margin-top:7px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;padding:10px;cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}.stat{text-align:center;border:1px solid var(--line);background:#0d0f12;border-radius:8px;padding:7px 3px}.stat b{display:block;font-size:15px}.stat span{font-size:9px;color:var(--muted)}.card{border:1px solid var(--line);background:#0d0f12;border-radius:10px;padding:12px}.card-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.chips{display:flex;gap:5px;flex-wrap:wrap}.chip{border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;background:var(--panel2)}.chip.primary{border-color:#cfd5dc;font-weight:650}.sep{height:1px;background:var(--line);margin:10px 0}.result{font-size:12px;line-height:1.5;margin-top:10px}.star-actions{display:grid;grid-template-columns:1fr 1fr;gap:6px}.btn{border:1px solid var(--line);background:var(--panel2);border-radius:9px;padding:8px 10px;cursor:pointer}.hint{font-size:10px;color:var(--muted);line-height:1.45}.notice{padding:8px 9px;background:var(--soft);border-radius:8px;font-size:11px;margin-top:8px}.game-over{font-weight:700}.combat-grid{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center;font-size:10px}.combat-grid div{padding:5px 2px;border:1px solid var(--line);border-radius:6px}.combat-grid b{display:block;font-size:12px}.hidden{display:none!important}
.hex-menu{position:absolute;z-index:20;min-width:260px;background:#15181d;border:1px solid #30353e;border-radius:14px;padding:10px;box-shadow:0 18px 50px #000a}.hex-menu-head{display:flex;justify-content:space-between;align-items:center;padding:3px 4px 9px}.hex-menu-title{font-weight:750}.hex-menu-close{border:0;background:transparent;color:var(--muted);font-size:20px;cursor:pointer}.choice-grid{display:grid;grid-template-columns:1fr 1fr;gap:7px}.piece-choice{display:flex;gap:9px;align-items:center;border:1px solid var(--line);background:#0e1013;border-radius:10px;padding:9px;cursor:pointer;text-align:left}.piece-choice:hover{border-color:#505965;background:#171a20}.piece-choice .fa-icon{width:38px;height:38px;display:grid;place-items:center;flex:none;font-size:15px;border:4px solid currentColor;border-radius:50%;background:#0b0d10}.choice-human{color:var(--human)}.choice-automa{color:var(--automa)}.piece-choice small{opacity:.62;font-size:10px}.choice-clear{grid-column:1/-1;justify-content:center;color:var(--muted)}.choice-encounter{grid-column:1/-1;color:#f4b942}.choice-encounter .fa-icon{width:34px;height:34px;border-width:2px;font-size:14px}
.territory polygon{transition:.12s ease}.water-hex polygon{fill:rgba(32,145,190,.18)!important;stroke:rgba(90,205,245,.42)!important}.water-mark{pointer-events:none}.encounter-mark{pointer-events:none}.encounter-mark circle{fill:rgba(12,14,17,.94);stroke:#f4b942;stroke-width:2}.encounter-mark i{color:#f4b942}.river-edge{stroke:#42bff5;stroke-width:8;stroke-linecap:round;pointer-events:none}.water-legend{display:flex;gap:8px;align-items:center;color:#76d7ff;font-size:11px;margin-top:6px}.board-icon{pointer-events:none}.board-piece{width:44px;height:44px;display:grid;place-items:center;border:4px solid var(--piece-color);border-radius:50%;color:var(--piece-color);background:#0b0d10;box-shadow:0 5px 14px #0008}.board-piece i{font-size:18px}.board-icon.combat .board-piece{width:46px;height:46px}.board-icon.combat i{font-size:20px}.territory polygon{fill:rgba(10,12,15,.20);stroke:rgba(255,255,255,.42);stroke-width:1.2}.territory:hover polygon{fill:rgba(255,255,255,.10);stroke:#eef2f6!important;filter:brightness(1.08)}.home-base{pointer-events:none}.home-base .home-ring{filter:drop-shadow(0 5px 14px #000c)}.home-label{font-size:9px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;paint-order:stroke;stroke:#090a0d;stroke-width:3px;stroke-linejoin:round}.piece-icon{pointer-events:none}.combat-bolt{filter:drop-shadow(0 3px 8px #000)}.home-unit{pointer-events:none}.home-unit circle{fill:#0b0d10;stroke-width:3}.home-unit text{font-size:10px;font-weight:800;text-anchor:middle;dominant-baseline:middle}.home-unit-count{font-size:8px!important;fill:#fff!important;stroke:#0b0d10;stroke-width:2px;paint-order:stroke}.factory-icon{pointer-events:none;filter:drop-shadow(0 4px 10px #000c)}.factory-icon circle{fill:rgba(8,11,15,.88);stroke:#fff;stroke-width:2.5}
.combat-bolt{cursor:pointer;pointer-events:auto}.combat-bolt .board-piece{cursor:pointer}
.combat-overlay{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:18px;background:rgba(3,5,8,.78);backdrop-filter:blur(8px)}
.combat-dialog{width:min(560px,100%);background:#111317;border:1px solid #30353e;border-radius:18px;box-shadow:0 28px 90px #000c;overflow:hidden}
.combat-dialog-head{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line)}
.combat-dialog-head h2{font-size:18px;margin:0}.combat-dialog-body{padding:18px}.combat-vs{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:12px;margin-bottom:16px}.combat-side{border:1px solid var(--line);border-radius:13px;padding:13px;background:#0d0f12}.combat-side strong{display:block;font-size:15px}.combat-side small{color:var(--muted)}.combat-vs-mark{width:38px;height:38px;display:grid;place-items:center;border-radius:50%;background:#211b09;color:#ffd85a;font-size:18px}
.combat-details{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:12px 0}.combat-detail{border:1px solid var(--line);border-radius:10px;padding:10px;background:#0d0f12}.combat-detail b{display:block;font-size:16px}.combat-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:16px}.combat-action{border:1px solid var(--line);border-radius:11px;padding:12px;font-weight:750;cursor:pointer;background:var(--panel2)}.combat-action.human{border-color:var(--human);color:var(--human)}.combat-action.automa{border-color:var(--automa);color:var(--automa)}.combat-card-btn{width:100%;margin-top:10px;border:1px solid #6a5522;background:#1b170d;color:#ffd85a;border-radius:10px;padding:10px;font-weight:700;cursor:pointer}.combat-note{font-size:11px;color:var(--muted);line-height:1.5;margin-top:10px}

@media(max-width:900px){.layout{grid-template-columns:1fr}.side{order:-1}#board{min-height:420px}.app{padding:10px}.hex-menu{position:fixed!important;left:12px!important;right:12px!important;bottom:12px!important;top:auto!important}}

.setup-fields.hidden{display:none}
.setup-start{width:100%;margin-top:12px}
.home-role{font-size:10px;font-weight:400;letter-spacing:.08em;text-transform:uppercase;opacity:.4;paint-order:stroke;stroke:#080a0d;stroke-width:2px;stroke-linejoin:round;pointer-events:none}


button,.territory,.combat-bolt,.piece-choice{touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.territory{pointer-events:all}

/* Compact phone layout: maximize usable board/card space */
@media(max-width:600px){
  html,body{margin:0;padding:0}
  .app{padding:4px;max-width:none}
  .top{margin-bottom:4px;padding:2px 1px}
  .top .sub{display:none}
  .brand{font-size:14px}
  .top .btn{padding:6px 9px;font-size:10px}
  .layout{gap:4px}
  .panel{border-radius:8px}
  .board-wrap{padding:2px;overflow:hidden}
  .board-head{padding:3px 4px 0;margin:0}
  .board-head .label{font-size:8px}
  .board-hint{display:none}
  #board{
    width:100%;
    min-height:0;
    height:auto;
    display:block;
    margin:0;
  }
  .side{gap:4px}
  .box{padding:7px;margin:0;border-radius:8px}
  .row{gap:5px}
  .field .label,.label{font-size:8px}
  select,input{padding:7px 8px;font-size:12px}
  .phase-line{margin-top:5px!important}
  .phase{font-size:13px}
  .badge{font-size:9px;padding:3px 6px}
  .tracker{gap:2px;margin-top:5px;flex-wrap:nowrap}
  .track-cell{width:20px;height:20px;border-radius:4px;font-size:9px}
  .stars{font-size:27px;letter-spacing:4px;margin-top:7px}
  .stats{gap:3px}
  .stat{padding:5px 2px}
  .stat b{font-size:13px}
  .stat span{font-size:8px}
  .draw{padding:10px;border-radius:8px}
  .card{padding:8px;border-radius:8px}
  .card-head{margin-bottom:6px}
  .chips{gap:3px}
  .chip{padding:4px 6px;font-size:10px}
  .sep{margin:6px 0}
  .result{margin-top:6px;font-size:11px}
  .combat-grid{gap:3px}
  .combat-grid div{padding:5px}
  .hex-menu{left:4px!important;right:4px!important;bottom:4px!important}
}

</style>
</head>
<body>
<div class="app">
  <div class="top"><div><div class="brand">Scythe · Automa</div><div class="sub">minimalistische solo helper</div></div><button id="reset" class="btn">Start spel</button></div>
  <div class="layout">
    <section class="panel board-wrap">
      <div class="board-head"><div><div class="label">Speelbord</div><div class="board-hint">Klik op een hex om units of encounter tokens te plaatsen/wijzigen · blauw = rivier/lake</div></div></div>
      <svg id="board" viewBox="-18 -18 806 758"></svg>
      <div id="hexMenu" class="hex-menu hidden"></div>
    </section>

    <aside class="panel side">
      <div class="box">
        <div id="setupFields" class="setup-fields">
          <div class="row">
            <label class="field"><div class="label">Jouw factie</div><select id="humanFaction"><option value="blue">Nordic</option><option value="red">Rusviet</option><option value="yellow">Crimea</option><option value="white">Polania</option><option value="black" selected>Saxony</option><option value="green">Albion</option><option value="purple">Togawa</option></select></label>
            <label class="field"><div class="label">Automa-factie</div><select id="automaFaction"><option value="red">Rusviet</option><option value="blue" selected>Nordic</option><option value="yellow">Crimea</option><option value="white">Polania</option><option value="black">Saxony</option><option value="green">Albion</option><option value="purple">Togawa</option></select></label>
          </div>
          <label class="field" style="display:block;margin-top:8px"><div class="label">Moeilijkheid</div><select id="difficulty"><option value="easy">Autometta</option><option value="normal" selected>Automa</option><option value="hard">Automaszyna</option><option value="very hard">Ultimaszyna</option></select></label>
          <button id="startGame" class="draw setup-start">Start spel</button>
        </div>
        <div class="phase-line" style="margin-top:12px"><div><div class="label">Fase</div><div id="phase" class="phase">Scheme I</div></div><div id="river" class="badge">Rivieren: nee</div></div>
        <div id="tracker" class="tracker"></div>
        <div id="stars" class="stars">☆☆☆☆☆☆</div>
      </div>
      <div class="box">
        <div class="row"><label class="field"><div class="label">Power</div><input id="power" type="number" min="0" max="16" value="4"></label><div><div class="label">Deck</div><div id="deckInfo" style="padding-top:9px">19 kaarten</div></div></div>
      </div>
      <div class="box"><div class="stats"><div class="stat"><b id="coins">0</b><span>coins</span></div><div class="stat"><b id="combatCards">0</b><span>combat cards</span></div><div class="stat"><b id="workers">2</b><span>workers</span></div><div class="stat"><b id="starsCount">0</b><span>stars</span></div></div></div>
      <div class="box"><button id="draw" class="draw">Trek Automa-kaart</button><div id="status" class="notice hidden"></div></div>
      <div class="box"><div id="card" class="card"><div class="muted">Trek een kaart om te beginnen.</div></div><div id="result" class="result hidden"></div></div>
    </aside>
  </div>
</div>
<div id="combatOverlay" class="combat-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="combatTitle">
  <div class="combat-dialog">
    <div class="combat-dialog-head"><div><div class="label">Combat</div><h2 id="combatTitle">Gevecht resolven</h2></div><button class="hex-menu-close" onclick="closeCombatOverlay()" aria-label="Sluiten">×</button></div>
    <div id="combatOverlayBody" class="combat-dialog-body"></div>
  </div>
</div>

        if (selectedHuman)
            svg.insertAdjacentHTML('beforeend', `<text class="home-role" x="${f.home.x}" y="${f.home.y + 51}" text-anchor="middle" fill="${f.color}">YOU</text>`);
        const owners = ['human', 'automa'];
        owners.forEach((owner, oi) => {
            const c = factionColorForOwner(owner), own = homeUnits.filter(u => u.owner === owner);
            const counts = { worker: own.filter(u => u.type === 'worker').length, mech: own.filter(u => u.type === 'mech').length, character: own.filter(u => u.type === 'character').length };
            const entries = ['character', 'mech', 'worker'].filter(type => counts[type] > 0);
            entries.forEach((type, i) => {
                const angle = (-70 + (i * 42) + (oi ? 12 : -12)) * Math.PI / 180, rr = 47, x = f.home.x + Math.cos(angle) * rr, y = f.home.y + Math.sin(angle) * rr;
                const icon = type === 'worker' ? '●' : type === 'mech' ? '⚔' : '★';
                svg.insertAdjacentHTML('beforeend', `<g class="home-unit"><circle cx="${x}" cy="${y}" r="12" stroke="${c}"/><text x="${x}" y="${y + 1}" fill="${c}">${icon}</text>${counts[type] > 1 ? `<circle cx="${x + 9}" cy="${y - 9}" r="7" fill="${c}"/><text class="home-unit-count" x="${x + 9}" y="${y - 8}">${counts[type]}</text>` : ''}</g>`);
            });
        });
    }
    for (const t of boardTerritories) {
        const here = at(t.id), h = here.find(u => u.owner === 'human'), a = here.find(u => u.owner === 'automa');
        const showBolt = game.combatVisible && h && a && (game.combatCardMode || game.combatTerritory === t.id);
        if (showBolt) {
            svg.insertAdjacentHTML('beforeend', `<g class="combat-bolt" data-combat="${t.id}"><circle cx="${t.x}" cy="${t.y}" r="28" fill="transparent" pointer-events="all"/>${faBoardIcon('bolt', '#ffd85a', t.x, t.y, true)}</g>`);
            continue;
        }
        if (h)
            svg.insertAdjacentHTML('beforeend', faBoardIcon(h.type, factionColorForOwner('human'), t.x - (a ? 13 : 0), t.y));
        if (a)
            svg.insertAdjacentHTML('beforeend', faBoardIcon(a.type, factionColorForOwner('automa'), t.x + (h ? 13 : 0), t.y));
    }
    svg.querySelectorAll('.territory').forEach(g => g.onclick = e => openHexMenu(+g.dataset.id, e));
    svg.querySelectorAll('.combat-bolt').forEach(g => g.onclick = e => { e.stopPropagation(); const id = +g.dataset.combat; if (!game.activeCombat)
        setCombatState(id, game.lastCard, 'board'); openCombatOverlay(); });
}
function setPiece(id, owner, type) { units = units.filter(u => !(u.territory === id && u.owner === owner)); if (type)
    add(owner, type, id, false); const startsCombat = isCombatUnit({ type }) && hasCombatAt(id); if (startsCombat)
    setCombatState(id, null, owner); closeHexMenu(); renderAll(); if (startsCombat)
    openCombatOverlay(); }
function clearHex(id) { units = units.filter(u => u.territory !== id); closeHexMenu(); renderAll(); }
function toggleEncounter(id) { if (markers.encounter.has(id))
    markers.encounter.delete(id);
else
    markers.encounter.add(id); closeHexMenu(); renderAll(); }
function iconMini(type, color) { return `<span class="fa-icon" style="color:${color}"><i class="fa-solid ${faClass[type]}"></i></span>`; }
function openHexMenu(id, e) {
    syncFactionColors();
    const menu = $('#hexMenu'), t = territories[id], rect = $('.board-wrap').getBoundingClientRect();
    const humanColor = factionColorForOwner('human'), automaColor = factionColorForOwner('automa');
    const humanName = factionData[$('#humanFaction').value].name, automaName = factionData[$('#automaFaction').value].name;
    const encounterPresent = markers.encounter.has(id);
    menu.innerHTML = `<div class="hex-menu-head"><div><div class="label">Hex ${id + 1}</div><div class="hex-menu-title">Kies bezetting</div></div><button class="hex-menu-close" onclick="closeHexMenu()">×</button></div><div class="choice-grid"><button class="piece-choice choice-human" onclick="setPiece(${id},'human','worker')">${iconMini('worker', humanColor)}<span>Jij · worker <small>(${humanName})</small></span></button><button class="piece-choice choice-automa" onclick="setPiece(${id},'automa','worker')">${iconMini('worker', automaColor)}<span>Automa · worker <small>(${automaName})</small></span></button><button class="piece-choice choice-human" onclick="setPiece(${id},'human','mech')">${iconMini('mech', humanColor)}<span>Jij · mech <small>(${humanName})</small></span></button><button class="piece-choice choice-automa" onclick="setPiece(${id},'automa','mech')">${iconMini('mech', automaColor)}<span>Automa · mech <small>(${automaName})</small></span></button><button class="piece-choice choice-human" onclick="setPiece(${id},'human','character')">${iconMini('character', humanColor)}<span>Jij · character <small>(${humanName})</small></span></button><button class="piece-choice choice-automa" onclick="setPiece(${id},'automa','character')">${iconMini('character', automaColor)}<span>Automa · character <small>(${automaName})</small></span></button><button class="piece-choice choice-encounter" onclick="toggleEncounter(${id})"><span class="fa-icon" style="color:#f4b942"><i class="fa-solid fa-compass"></i></span><span>${encounterPresent ? 'Verwijder encounter token' : 'Plaats encounter token'}</span></button><button class="piece-choice choice-clear" onclick="clearHex(${id})">Maak hex leeg</button></div>`;
    menu.classList.remove('hidden');
    const x = Math.min(e.clientX - rect.left + 10, rect.width - 280), y = Math.min(e.clientY - rect.top + 10, rect.height - 330);
    menu.style.left = Math.max(8, x) + 'px';
    menu.style.top = Math.max(8, y) + 'px';
}
function closeHexMenu() { $('#hexMenu').classList.add('hidden'); }
function highlight() { render(); }
function territoryClick() { }
function unitClick() { }
let gameStarted = false;
function showSetup() {
    gameStarted = false;
    $('#setupFields').classList.remove('hidden');
    $('#reset').textContent = 'Start spel';
}
function startConfiguredGame() {
    resetGame();
    gameStarted = true;
    $('#setupFields').classList.add('hidden');
    $('#reset').textContent = 'Nieuw spel';
}
function newGameWizard() {
    if (gameStarted) {
        showSetup();
    }
    else {
        startConfiguredGame();
    }
}
$('#draw').onclick = draw;
$('#reset').onclick = newGameWizard;
$('#startGame').onclick = startConfiguredGame;
$('#difficulty').onchange = () => { };
$('#humanFaction').onchange = () => { ensureDistinctFactions('human'); renderAll(); };
$('#automaFaction').onchange = () => { ensureDistinctFactions('automa'); renderAll(); };
$('#power').onchange = () => { checkPowerStar(); renderAll(); };
// Render the default Saxony vs Nordic setup preview, but keep the setup step visible.
resetGame();
showSetup();
</script>
